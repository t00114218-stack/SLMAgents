[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["slm_email"]

[project]
name = "slm-email"
version = "0.1.0"
description = "CPU-optimized Email Assistant agent for spam classification, action extraction, and PII-safe reply drafting"
readme = "README.md"
requires-python = ">=3.9"
keywords = [
    "llm", "slm", "email", "inbox", "spam", "privacy", "local-ai", "cpu-inference"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3"
]
dependencies = [
    "slm-security",
    "onnxruntime-genai>=0.2.0",
    "pyyaml"
]

[[project.authors]]
name = "Suryaprakash CV"
email = "suryaprakash.c.v@gmail.com"
