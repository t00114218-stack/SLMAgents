[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["slm_orchestrator"]


[project]
name = "slm-orchestrator"
version = "0.1.3"
description = "A configurable semantic routing orchestrator powered by a local Small Language Model (SLM)"
readme = "README.md"
requires-python = ">=3.9"
keywords = [
    "llm", "slm", "agent", "orchestrator", "routing", "semantic-router", "llama-cpp", "local-ai", "structured-output"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "onnxruntime-genai>=0.2.0",
    "huggingface_hub>=0.10.0",
    "pyyaml"
]

[[project.authors]]
name = "Suryaprakash CV"
email = "suryaprakash.c.v@gmail.com"

[project.urls]
Homepage = "https://github.com/SuryaprakashCV/SLM---Orchestrator"
"Bug Tracker" = "https://github.com/SuryaprakashCV/SLM---Orchestrator/issues"
"Source Code" = "https://github.com/SuryaprakashCV/SLM---Orchestrator"
