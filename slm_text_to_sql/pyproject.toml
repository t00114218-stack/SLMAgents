[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["slm_text_to_sql"]

[project]
name = "slm-text-to-sql"
version = "0.1.0"
description = "A lightweight, CPU-optimized Text-to-SQL translation agent powered by a local Small Language Model (SLM)"
readme = "README.md"
requires-python = ">=3.9"
keywords = [
    "llm", "slm", "text-to-sql", "sql", "qwen", "local-ai", "cpu-inference"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "onnxruntime-genai>=0.2.0",
    "huggingface_hub>=0.10.0",
    "pyyaml"
]

[[project.authors]]
name = "Suryaprakash CV"
email = "suryaprakash.c.v@gmail.com"
