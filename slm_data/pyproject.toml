[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["slm_data"]

[project]
name = "slm-data"
version = "0.1.0"
description = "CPU-optimized Data Analyst agent for CSV, Excel, and Parquet files with pandas and matplotlib code execution"
readme = "README.md"
requires-python = ">=3.9"
keywords = [
    "llm", "slm", "data-analysis", "pandas", "matplotlib", "csv", "local-ai", "cpu-inference"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3"
]
dependencies = [
    "pandas>=1.3.0",
    "slm-code-interpreter",
    "pyyaml"
]

[[project.authors]]
name = "Suryaprakash CV"
email = "suryaprakash.c.v@gmail.com"
