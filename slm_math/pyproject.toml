[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["slm_math"]

[project]
name = "slm-math"
version = "0.1.0"
description = "A CPU-optimized Math Agent translating natural language to equations, evaluating via SymPy, and generating step-by-step solutions"
readme = "README.md"
requires-python = ">=3.9"
keywords = [
    "llm", "slm", "math", "sympy", "equations", "algebra", "local-ai", "cpu-inference"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3"
]
dependencies = [
    "sympy>=1.10.0",
    "onnxruntime-genai>=0.2.0",
    "pyyaml"
]

[[project.authors]]
name = "Suryaprakash CV"
email = "suryaprakash.c.v@gmail.com"
