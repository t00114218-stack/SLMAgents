[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["slm_security"]

[project]
name = "slm-security"
version = "0.1.0"
description = "A sub-5ms CPU-optimized security guardrail and PII audit agent for local SLM workflows"
readme = "README.md"
requires-python = ">=3.9"
keywords = [
    "llm", "slm", "security", "pii", "guardrails", "injection", "jailbreak", "local-ai"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3"
]
dependencies = [
    "pyyaml"
]

[[project.authors]]
name = "Suryaprakash CV"
email = "suryaprakash.c.v@gmail.com"
