[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["slm_translation"]

[project]
name = "slm-translation"
version = "0.1.0"
description = "Dynamic local CPU translation hub supporting Indian and global languages with layout preservation"
readme = "README.md"
requires-python = ">=3.9"
keywords = [
    "llm", "slm", "translation", "indian-languages", "indic", "nllb", "local-ai", "cpu-inference"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3"
]
dependencies = [
    "transformers>=4.28.0",
    "pyyaml"
]

[[project.authors]]
name = "Suryaprakash CV"
email = "suryaprakash.c.v@gmail.com"
