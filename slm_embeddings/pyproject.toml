[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["slm_embeddings"]

[project]
name = "slm-embeddings"
version = "0.1.0"
description = "A lightweight local CPU-optimized embedding engine powered exclusively by mixbread-ai/mxbai-embed-large ONNX"
readme = "README.md"
requires-python = ">=3.9"
keywords = [
    "llm", "slm", "embeddings", "mixbread", "mxbai", "vectors", "local-ai", "cpu-inference"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3"
]
dependencies = [
    "onnxruntime>=1.14.0",
    "transformers>=4.28.0",
    "numpy>=1.20.0",
    "pyyaml"
]

[[project.authors]]
name = "Suryaprakash CV"
email = "suryaprakash.c.v@gmail.com"
