[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["slm_task_planner"]

[project]
name = "slm-task-planner"
version = "0.1.0"
description = "CPU-optimized Task Planner agent for autonomous goal decomposition and sub-agent task orchestration"
readme = "README.md"
requires-python = ">=3.9"
keywords = [
    "llm", "slm", "planner", "agentic", "dag", "orchestration", "local-ai", "cpu-inference"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3"
]
dependencies = [
    "onnxruntime-genai>=0.2.0",
    "pyyaml"
]

[[project.authors]]
name = "Suryaprakash CV"
email = "suryaprakash.c.v@gmail.com"
