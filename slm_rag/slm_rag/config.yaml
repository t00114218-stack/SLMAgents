models:
  rag:
    path: "../../models/qwen2.5-1.5b-onnx"
    repo_id: "tonythethompson/Qwen2.5-1.5B-Instruct-ONNX"

# Performance tuning
# n_threads: Number of CPU threads for ONNX Runtime inference.
#   Increase to match your physical core count for faster generation.
#   Recommended: 4 (default), 8 (modern desktop), or nproc output.
# max_tokens: Default token budget per answer. Lower = faster.
#   256 = concise answer (~5-15s on 4-core CPU)
#   128 = very short answer (~3-8s on 4-core CPU)
inference:
  n_threads: 4
  max_tokens: 256
