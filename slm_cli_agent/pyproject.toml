[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["slm_cli_agent"]

[project]
name = "slm-cli-agent"
version = "0.1.0"
description = "A lightweight local CPU-optimized CLI executor agent via ONNX Runtime with safety filters"
readme = "README.md"
requires-python = ">=3.9"
keywords = [
    "llm", "slm", "cli", "shell", "bash", "local-ai", "cpu-inference"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3"
]
dependencies = [
    "onnxruntime-genai>=0.2.0",
    "huggingface_hub>=0.10.0",
    "pyyaml"
]

[[project.authors]]
name = "Suryaprakash CV"
email = "suryaprakash.c.v@gmail.com"
