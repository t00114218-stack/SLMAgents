[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["slm_pkb"]

[project]
name = "slm-pkb"
version = "0.1.0"
description = "CPU-optimized Personal Knowledge Base agent for Obsidian and Logseq markdown vaults"
readme = "README.md"
requires-python = ">=3.9"
keywords = [
    "llm", "slm", "pkb", "obsidian", "logseq", "markdown", "vault", "local-ai", "cpu-inference"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3"
]
dependencies = [
    "slm-embeddings",
    "pyyaml"
]

[[project.authors]]
name = "Suryaprakash CV"
email = "suryaprakash.c.v@gmail.com"
